name: Build

# À chaque envoi sur main : compile Mac (universel, VST3 + AU) et Windows (VST3), puis, si les deux
# réussissent, publie la version dans ONIRIQUE CENTRAL (numéro attribué par le serveur, patch + 1).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Sans clé de publication, la dernière étape dépose la version sur une branche (voir plus bas)
permissions:
  contents: write

env:
  TARGET: OniriqueReverb            # cible CMake
  PRODUCT: ONIRIQUE VERB            # PRODUCT_NAME du plugin
  SLUG: onirique-verb               # identifiant du plugin dans ONIRIQUE CENTRAL

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Compiler (universel arm64 + x86_64)
        run: |
          cmake -B build -G Xcode
          cmake --build build --config Release -- -quiet
      - name: Signer (ad hoc) et empaqueter
        run: |
          OUT="build/${TARGET}_artefacts/Release"
          mkdir central
          cp -R "$OUT/VST3/$PRODUCT.vst3" "$OUT/AU/$PRODUCT.component" central/
          for p in central/*; do codesign --force --deep --sign - "$p"; done
          lipo -info "central/$PRODUCT.vst3/Contents/MacOS/$PRODUCT"
          # Format ONIRIQUE CENTRAL : « NOM.vst3.zip » avec NOM.vst3 et NOM.component à la racine.
          mkdir -p dist/mac
          (cd central && ditto -c -k . "../dist/mac/$PRODUCT.vst3.zip")
      - name: Valider l'Audio Unit (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "central/$PRODUCT.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Orv1 Onrq
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: dist/mac }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler
        run: |
          cmake -B build
          cmake --build build --config Release
      - name: Empaqueter
        shell: bash
        run: |
          mkdir -p dist/win
          cp "build/${TARGET}_artefacts/Release/VST3/$PRODUCT.vst3/Contents/x86_64-win/$PRODUCT.vst3" dist/win/
      - uses: actions/upload-artifact@v4
        with: { name: win, path: dist/win }

  publish:
    needs: [mac, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: mac, path: version/mac }
      - uses: actions/download-artifact@v4
        with: { name: win, path: version/win }
      - name: Publier dans ONIRIQUE CENTRAL
        env:
          CLE: ${{ secrets.ONIRIQUE_PUBLISH_KEY }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # notes de version = message du commit, sans les lignes de signature ni [skip ci]
          printf '%s\n' "$MESSAGE" | grep -viE '^(co-authored-by|signed-off-by):' | sed -e 's/ *\[skip ci\]//' -e ':a' -e '/^[[:space:]]*$/{$d;N;ba' -e '}' | head -c 4000 > version/notes.txt
          if [ -z "$CLE" ]; then
            # Sans clé : la version (win/, mac/, notes.txt) est laissée sur la branche ci-version, à publier à la main
            # depuis le serveur avec publish-plugin.mjs.
            echo "Secret ONIRIQUE_PUBLISH_KEY absent : version déposée sur la branche ci-version."
            cd version && git init -q && git config user.name build && git config user.email build@users.noreply.github.com
            git checkout -q -b ci-version && git add -A && git commit -q -m "Version de ${GITHUB_SHA}"
            git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci-version
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/publish && chmod 600 ~/.ssh/publish
          # clé du serveur épinglée (SHA256:s17azxD9lgapSvGarqB34msuvdMJLWvFV7ptd79FZsc)
          echo "217.160.106.244 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICV3xBScmxJy34Jgjtvb0R4UCG3jmzkSU+/T1lDrvD/l" >> ~/.ssh/known_hosts
          ls -R version
          tar -C version -cf - . | ssh -i ~/.ssh/publish -o IdentitiesOnly=yes -o BatchMode=yes livraison@217.160.106.244 "publish $SLUG"
