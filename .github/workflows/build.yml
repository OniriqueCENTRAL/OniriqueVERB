name: Build

# À chaque envoi sur main : compile Mac (universel, VST3 + AU) et Windows (VST3), puis, si les deux
# réussissent, publie la version dans ONIRIQUE CENTRAL (numéro attribué par le serveur, patch + 1).
on:
  push:
    branches: [mac-build]
  workflow_dispatch:

# Sans clé de publication, la dernière étape dépose la version sur une branche (voir plus bas)
permissions:
  contents: write

env:
  TARGET: OniriqueReverb            # cible CMake
  PRODUCT: ONIRIQUE VERB            # PRODUCT_NAME du plugin
  SLUG: onirique-verb               # identifiant du plugin dans ONIRIQUE CENTRAL

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Compiler (universel arm64 + x86_64)
        run: |
          cmake -B build -G Xcode
          cmake --build build --config Release -- -quiet
      - name: Signer (ad hoc) et empaqueter
        run: |
          OUT="build/${TARGET}_artefacts/Release"
          mkdir central
          cp -R "$OUT/VST3/$PRODUCT.vst3" "$OUT/AU/$PRODUCT.component" central/
          for p in central/*; do codesign --force --deep --sign - "$p"; done
          lipo -info "central/$PRODUCT.vst3/Contents/MacOS/$PRODUCT"
          # Format ONIRIQUE CENTRAL : « NOM.vst3.zip » avec NOM.vst3 et NOM.component à la racine.
          mkdir -p dist/mac
          (cd central && ditto -c -k . "../dist/mac/$PRODUCT.vst3.zip")
      - name: Valider l'Audio Unit (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "central/$PRODUCT.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Orv1 Onrq
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: dist/mac }

